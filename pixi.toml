[workspace]
authors = ["Str-Gen <20303842+Str-Gen@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "moxie"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
start = "mojo run -I src examples/estimator.mojo"
build = { cmd = "mkdir -p builds && mojo precompile -I ../../mojo-snappy/src src/moxie -o builds/moxie.mojoc && mojo build -I src examples/estimator.mojo -o builds/example" }
test = { cmd = "mojo run -I src -I examples tests/test_contracts.mojo && mojo run -I src tests/test_capabilities.mojo && bash tests/check_compile_fail.sh && mojo run -I src tests/test_serialization.mojo && mojo run -I src -I ../../mojo-snappy/src tests/test_serialization_snappy.mojo && python tests/serialization_wire.py" }

[dependencies]
mojo = "*"
