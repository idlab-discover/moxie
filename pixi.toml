[workspace]
authors = ["Str-Gen <20303842+Str-Gen@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "moxie"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
impute-build = "python tools/impute_checks.py build"
impute-test = "python tools/impute_checks.py test"
impute-parity = "python tools/impute_checks.py parity"
impute-start = "python tools/impute_checks.py start"
impute-independence = "python tools/impute_independence.py"
neighbors-build = "python tools/neighbors_checks.py build"
neighbors-test = "python tools/neighbors_checks.py test"
neighbors-parity = "python tools/neighbors_checks.py parity"
neighbors-start = "python tools/neighbors_checks.py example"
linear-model-build = "python tools/linear_model_checks.py build"
linear-model-test = "python tools/linear_model_checks.py test"
linear-model-parity = "python tools/linear_model_checks.py parity"
linear-model-start = "python tools/linear_model_checks.py start"
model-selection = "python tools/model_selection_checks.py all"
build = "python tools/check.py build"
test = { cmd = "python tools/check.py test", depends-on = ["build"] }
parity = { cmd = "python tools/check.py parity", depends-on = ["build"], env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", PYTHONDONTWRITEBYTECODE = "1" } }
start = { cmd = "builds/examples/dummy", depends-on = ["build"] }
scaffold-start = { cmd = "builds/examples/estimator", depends-on = ["build"] }

covariance-test = "python families/covariance/tools/check.py test"
covariance-parity = "python families/covariance/tools/check.py parity"
covariance-audit = { cmd = "python families/covariance/tests/audit.py", depends-on = ["covariance-test"] }
covariance-numerical-audit = { cmd = "python families/covariance/tests/numerical_focus.py", depends-on = ["covariance-test"] }

tree-build = "python tools/tree_checks.py build"
tree-test = "python tools/tree_checks.py test"
tree-parity = "python tools/tree_checks.py parity"
tree-prepare-oracle = "python tools/prepare_tree_oracle.py"

feature-selection-build = "python tools/feature_selection_checks.py build"
feature-selection-test = "python tools/feature_selection_checks.py test"
feature-selection-parity = "python tools/feature_selection_checks.py parity"

mixture-build = "python tools/mixture_checks.py build"
mixture-test = "python tools/mixture_checks.py test"
mixture-parity = "python tools/mixture_checks.py parity"

[dependencies]
mojo = "==1.0.0"
max-core = "==26.5.0"
python = ">=3.14.7,<3.15"
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"
pyperf = ">=2.10.0,<3"
time = ">=1.10,<2"
cython = ">=3.2,<4"
setuptools = ">=80"
scikit-learn = ">=1.9.1,<2"
pandas = ">=3,<4"
