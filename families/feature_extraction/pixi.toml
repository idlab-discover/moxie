[workspace]
authors = ["Str-Gen <20303842+Str-Gen@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "moxie-feature_extraction"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "python tools/integration.py build"
test = "python tools/integration.py test"
start = "python tools/integration.py start"
parity = "python tools/integration.py parity"
independence = "python tools/integration.py independence"

[dependencies]
mojo = "==1.0.0"
max-core = "==26.5.0"
python = ">=3.14.7,<3.15"
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"
pyperf = ">=2.10.0,<3"
time = ">=1.10,<2"
cython = ">=3.2,<4"
setuptools = ">=80"
