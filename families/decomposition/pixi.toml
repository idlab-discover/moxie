[workspace]
authors = ["Str-Gen <20303842+Str-Gen@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "moxie-decomposition"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "python tools/family.py build"
engine-build = "python shared/svd_engine/tools/check.py build"
test = "python tools/family.py test"
engine-test = "python shared/svd_engine/tools/check.py test"
engine-parity = "python shared/svd_engine/tools/check.py parity"
parity = "python tools/family.py parity"
start = "python tools/family.py start"

[dependencies]
mojo = "==1.0.0"
max-core = "==26.5.0"
python = ">=3.14.7,<3.15"
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"
pyperf = ">=2.10.0,<3"
time = ">=1.10,<2"
cython = ">=3.2,<4"
setuptools = ">=80"
scikit-learn = ">=1.9.1,<2"

# Opt-in static Numax integration; the existing scaffold toolchain stays pinned.
[feature.numax.dependencies]
mojo = "==1.1.0"
max-core = "==26.6.0"
python = ">=3.14.7,<3.15"
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"

[feature.numax.tasks]
numax-build = "python tools/check_numax_pca.py build"
numax-test = "python tools/check_numax_pca.py test"
numax-parity = "python tools/check_numax_pca.py parity"
numax-start = "python tools/check_numax_pca.py start"

[environments]
numax = { features = ["numax"], no-default-feature = true }
