[workspace]
name = "assembly-consumer-b"
version = "0.1.0"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[tasks]
build = "python ../../../tools/fixture.py --consumer . build"
test = "python ../../../tools/fixture.py --consumer . test"

[dependencies]
mojo = "==1.0.0"
max-core = "==26.5.0"
python = ">=3.14.7,<3.15"
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"
pyperf = ">=2.10.0,<3"
time = ">=1.10,<2"
